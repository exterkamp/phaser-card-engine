<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A five-pointed star, drawn white so the card can tint it like the
       other suits. Points sized to fill the same optical area as a spade
       or heart at the same box, so a star ace doesn't read as smaller. -->
  <path d="M50,4 L61.8,36.6 L96.4,37.8 L69.1,59.1 L78.5,92.4 L50,72.5
           L21.5,92.4 L30.9,59.1 L3.6,37.8 L38.2,36.6 Z" fill="#ffffff"/>
  <!-- An inner star, cut a little smaller, to give it the engraved double
       outline the rest of the table dressing uses. -->
  <path d="M50,22 L57.4,42.4 L79.0,43.2 L62.0,56.5 L67.8,77.3 L50,64.9
           L32.2,77.3 L38.0,56.5 L21.0,43.2 L42.6,42.4 Z"
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
</svg>
